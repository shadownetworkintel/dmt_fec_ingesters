name: Run ingesters (scheduled)

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run ingesters using latest deployed image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE=$(flyctl status --app dmt-fec-ingesters --json | jq -r '.Image')
          echo "Using image: $IMAGE"
          flyctl machine run "$IMAGE" \
            --app dmt-fec-ingesters \
            --region iad \
            --cpus 1 \
            --memory 512 \
            --rm \
            --command "/app/docker-entrypoint.sh"
