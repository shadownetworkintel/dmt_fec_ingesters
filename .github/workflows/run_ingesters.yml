name: Run ingesters (scheduled)

on:
  schedule:
    # Daily at 2:30am Louisville (EST) = 07:30 UTC
    - cron: "30 7 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run ingesters using latest deployed Fly image (no build)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          APP="dmt-fec-ingesters"

          echo "Fetching deployed image tag from flyctl status for app: $APP"
          STATUS_OUT="$(flyctl status -a "$APP")"

          # Extract value after "Image    ="
          IMAGE_RAW="$(printf "%s\n" "$STATUS_OUT" | awk -F'= ' '/^[[:space:]]*Image[[:space:]]*=/ {print $2; exit}')"
          IMAGE_TAG="$(echo "$IMAGE_RAW" | xargs)"  # trim whitespace

          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: Could not determine deployed image tag from flyctl status output."
            echo "---- flyctl status output ----"
            printf "%s\n" "$STATUS_OUT"
            echo "-----------------------------"
            exit 1
          fi

          # Fly stores deployed images in registry.fly.io
          # Convert "dmt-fec-ingesters:deployment-XYZ" -> "registry.fly.io/dmt-fec-ingesters:deployment-XYZ"
          IMAGE="registry.fly.io/${IMAGE_TAG}"

          echo "Using image: $IMAGE"

          flyctl machine run "$IMAGE" \
            --app "$APP" \
            --region iad \
            --cpus 1 \
            --memory 512 \
            --rm \
            --command "/app/docker-entrypoint.sh"