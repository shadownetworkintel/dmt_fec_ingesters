name: Run ingesters (scheduled)

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: dmt-fec-ingesters
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run ingesters using latest image (no build)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          APP="dmt-fec-ingesters"
          IMAGE="registry.fly.io/${APP}:latest"

          echo "Using image: $IMAGE"

          flyctl machine run "$IMAGE" \
            --app "$APP" \
            --region iad \
            --cpus 1 \
            --memory 512 \
            --rm \
            --command "/app/docker-entrypoint.sh"