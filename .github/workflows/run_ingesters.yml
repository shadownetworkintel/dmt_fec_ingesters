name: Run ingesters (scheduled)

on:
  schedule:
    # Daily at 2:30am Louisville (EST) = 07:30 UTC
    - cron: "30 7 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run ingesters using latest deployed image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          APP="dmt-fec-ingesters"

          echo "Fetching deployed image for app: $APP"

          # Preferred: config show (stable)
          IMAGE=$(flyctl config show --app "$APP" --json | jq -r '.image // empty')

          # Fallback: if config doesn't include image, try the most recent machine's config
          if [ -z "$IMAGE" ]; then
            echo "No .image in flyctl config show; trying flyctl machine list fallback..."
            IMAGE=$(flyctl machine list --app "$APP" --json | jq -r '.[0].config.image // empty')
          fi

          if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
            echo "ERROR: Could not determine deployed image."
            echo "flyctl config show --json:"
            flyctl config show --app "$APP" --json || true
            echo "flyctl machine list --json:"
            flyctl machine list --app "$APP" --json || true
            exit 1
          fi

          echo "Using image: $IMAGE"

          flyctl machine run "$IMAGE" \
            --app "$APP" \
            --region iad \
            --cpus 1 \
            --memory 512 \
            --rm \
            --command "/app/docker-entrypoint.sh"
