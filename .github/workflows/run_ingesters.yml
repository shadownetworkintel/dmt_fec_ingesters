name: Run ingesters (scheduled)

on:
  schedule:
    # Daily at 2:30am Louisville (EST) = 07:30 UTC
    - cron: "30 7 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run ingesters using latest deployed image (no build)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          APP="dmt-fec-ingesters"

          echo "Fetching deployed image from flyctl status for app: $APP"

          IMAGE_RAW="$(flyctl status -a "$APP" | awk -F'= ' '/^[[:space:]]*Image[[:space:]]*=/ {print $2; exit}')"

          # Trim leading/trailing whitespace/newlines
          IMAGE="$(echo "$IMAGE_RAW" | xargs)"

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Could not determine deployed image from flyctl status output."
            flyctl status -a "$APP" || true
            exit 1
          fi

          echo "Using image: $IMAGE"

          flyctl machine run "$IMAGE" \
            --app "$APP" \
            --region iad \
            --cpus 1 \
            --memory 512 \
            --rm \
            --command "/app/docker-entrypoint.sh"