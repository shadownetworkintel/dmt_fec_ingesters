name: Run ingesters (scheduled)

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: dmt-fec-ingesters-fly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run ingesters (single-run, wait, cleanup)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found; installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          APP="dmt-fec-ingesters"
          REGION="iad"
          IMAGE="registry.fly.io/${APP}:latest"
          NAME_PREFIX="run-ingesters"

          echo "== Check for already-running ingester machine =="

          # If ANY machine is already starting/started, do not create another one.
          # This avoids overlap without killing runs during the scheduled job.
          RUNNING_ID="$(flyctl machine list -a "$APP" --json | jq -r '.[] | select(.state=="started" or .state=="starting") | .id' | head -n 1)"

          if [ -n "$RUNNING_ID" ]; then
            echo "An ingester machine is already running (ID: $RUNNING_ID)."
            echo "Skipping this run to avoid overlap."
            exit 0
          fi

          echo "== Cleanup any leftover machines (none are running) =="
          # If a previous run crashed before cleanup, we may have stopped machines left behind.
          # To enforce the invariant of 'never more than one machine exists', destroy any leftovers
          # before starting a fresh run.
          LEFTOVER_IDS="$(flyctl machine list -a "$APP" --json | jq -r '.[].id')"

          if [ -n "$LEFTOVER_IDS" ]; then
            echo "Destroying leftover machines:"
            echo "$LEFTOVER_IDS"

            while IFS= read -r id; do
              [ -z "$id" ] && continue
              echo "Destroying $id..."
              flyctl machine destroy "$id" -a "$APP" --force || true
            done <<< "$LEFTOVER_IDS"
          else
            echo "No leftover machines found."
          fi

          echo "== Start a new one-off machine =="
          # Create a run-specific name (timestamp)
          RUN_NAME="${NAME_PREFIX}-$(date +%Y%m%d%H%M%S)"
          echo "Using image: $IMAGE"
          echo "Run name: $RUN_NAME"

          # Start the machine (this may return quickly on some flyctl versions)
          flyctl machine run "$IMAGE" \
            --app "$APP" \
            --region "$REGION" \
            --vm-cpus 1 \
            --vm-memory 256 \
            --name "$RUN_NAME" \
            --restart no \
            --command "/app/docker-entrypoint.sh"

          echo "== Resolve machine id for this run name =="
          MACHINE_ID=""
          for i in $(seq 1 30); do
            MACHINE_ID="$(flyctl machine list -a "$APP" --json | jq -r --arg name "$RUN_NAME" '.[] | select(.name==$name) | .id' | head -n 1)"
            if [ -n "$MACHINE_ID" ] && [ "$MACHINE_ID" != "null" ]; then
              break
            fi
            echo "[$i] Waiting for machine to appear..."
            sleep 2
          done

          if [ -z "$MACHINE_ID" ] || [ "$MACHINE_ID" = "null" ]; then
            echo "ERROR: Could not determine machine id after starting run."
            flyctl machine list -a "$APP" || true
            exit 1
          fi

          echo "Machine ID: $MACHINE_ID"

          cleanup() {
            if [ -z "${MACHINE_ID:-}" ] || [ "${MACHINE_ID:-}" = "null" ]; then
              return 0
            fi

            echo "== Machine status (final) =="
            flyctl machine status "$MACHINE_ID" -a "$APP" || true

            echo "== Machine logs (final) =="
            flyctl machine logs "$MACHINE_ID" -a "$APP" || true

            echo "== Cleanup: destroy the machine =="
            flyctl machine destroy "$MACHINE_ID" -a "$APP" || true
          }

          # Always collect logs + destroy the one-off machine, even if the script errors.
          trap cleanup EXIT

          echo "== Wait for machine to stop =="
          # Poll status until it is not 'started'
          FINISHED="0"
          for i in $(seq 1 360); do
            STATE="$(flyctl machine status "$MACHINE_ID" -a "$APP" 2>/dev/null | awk -F': ' '/^State:/ {print $2; exit}' | xargs || true)"
            echo "[$i] State: ${STATE:-unknown}"

            if [ -z "$STATE" ]; then
              # status might briefly fail; keep trying
              sleep 10
              continue
            fi

            if [ "$STATE" != "started" ]; then
              echo "Machine finished with state: $STATE"
              FINISHED="1"
              break
            fi

            sleep 10
          done

          if [ "$FINISHED" != "1" ]; then
            echo "ERROR: Timed out waiting for machine to stop. Fetching logs anyway."
          fi

          echo "Done."

      - name: Notify Slack on workflow failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: *${{ github.workflow }}* failed for *${{ github.repository }}* on *${{ github.ref_name }}*\\nRun: ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"